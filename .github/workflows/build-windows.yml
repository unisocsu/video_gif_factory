name: Build Windows EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $exe = Get-ChildItem -Path ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item -Path $exe.FullName -Destination ffmpeg.exe

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name VideoToGif --add-binary "ffmpeg.exe;." video_to_gif.py

      - name: Package artifact twice inside zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage, final | Out-Null
          # זיפ ראשון: הקובץ עצמו
          Compress-Archive -Path dist/VideoToGif.exe -DestinationPath stage/VideoToGif.zip -Force
          # זיפ שני: הזיפ הראשון עטוף בזיפ נוסף
          Compress-Archive -Path stage/VideoToGif.zip -DestinationPath final/VideoToGif-package.zip -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: VideoToGif-windows
          path: final/VideoToGif-package.zip
