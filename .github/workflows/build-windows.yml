name: Build Windows EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (toolchain for building ffmpeg)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain

      - name: Build minimal ffmpeg (only what GIF conversion needs)
        shell: msys2 {0}
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          # ffmpeg.org לא נגיש מה-runner, לכן מורידים את אותו הקוד (תג n7.1) מ-GitHub
          git clone --depth 1 --branch n7.1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-7.1
          cd ffmpeg-7.1
          ./configure \
            --prefix="$PWD/install" \
            --arch=x86_64 \
            --target-os=mingw32 \
            --enable-static --disable-shared \
            --disable-everything --disable-doc --disable-debug \
            --disable-network --disable-autodetect --disable-x86asm \
            --disable-ffplay --disable-ffprobe \
            --enable-small \
            --enable-protocol=file \
            --enable-demuxer=mov,matroska,avi,asf,flv,mpegps,mpegts,mpegvideo,h264,hevc \
            --enable-parser=h264,hevc,mpeg4video,mpegvideo,vp8,vp9 \
            --enable-decoder=h264,hevc,mpeg4,mpeg2video,mpeg1video,vp8,vp9,mjpeg,png,wmv1,wmv2,wmv3,vc1,msmpeg4v3,rawvideo \
            --enable-filter=fps,scale,palettegen,paletteuse,split,format,null,buffer,buffersink \
            --enable-muxer=gif \
            --enable-encoder=gif \
            --enable-avfilter --enable-swscale \
            --enable-small
          make -j"$(nproc)"
          cp ffmpeg.exe "$(cygpath -u "$GITHUB_WORKSPACE")/ffmpeg.exe"
          strip --strip-all "$(cygpath -u "$GITHUB_WORKSPACE")/ffmpeg.exe"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller and UPX
        run: |
          pip install pyinstaller
          choco install upx -y

      - name: Build EXE
        run: pyinstaller --onefile --windowed --upx-dir "C:\ProgramData\chocolatey\bin" --name VideoToGif --add-binary "ffmpeg.exe;." video_to_gif.py

      - name: Package artifact twice inside zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage, final | Out-Null
          # זיפ ראשון: הקובץ עצמו
          Compress-Archive -Path dist/VideoToGif.exe -DestinationPath stage/VideoToGif.zip -Force
          # זיפ שני: הזיפ הראשון עטוף בזיפ נוסף
          Compress-Archive -Path stage/VideoToGif.zip -DestinationPath final/VideoToGif-package.zip -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: VideoToGif-windows
          path: final/VideoToGif-package.zip
